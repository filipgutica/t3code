name: Workbench demo kit
on:
  pull_request:
    paths:
      - "scripts/workbench-demo/**"
      - ".agents/skills/workbench-demo/**"
      - ".github/workflows/workbench-demo.yml"
      - "packages/contracts/src/**"
  push:
    branches: [main]
    paths:
      - "scripts/workbench-demo/**"
      - ".agents/skills/workbench-demo/**"
      - ".github/workflows/workbench-demo.yml"
      - "packages/contracts/src/**"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - run: node scripts/workbench-demo/cli.mts --help
      - run: vp lint scripts/workbench-demo --report-unused-disable-directives
      - run: vp exec tsc --noEmit -p scripts/workbench-demo/tsconfig.json
      - run: vp test run scripts/workbench-demo
      - run: bash -n scripts/workbench-demo/setup.sh && bash -n scripts/workbench-demo/setup-defaults.sh && bash -n scripts/workbench-demo/run.sh
