name: Workbench daily desktop release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Workbench release channel
        type: choice
        options: [nightly, stable]
        default: nightly
      bump:
        description: Workbench version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      upstream_tag:
        description: Published upstream event supplied by the sync workflow; blank for our own release
        type: string
        default: ""
  schedule:
    - cron: "17 2,8,14,20 * * *"
      timezone: America/Vancouver

concurrency:
  group: workbench-daily-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve main HEAD and release version
    if: github.repository == 'filipgutica/t3code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      metadata_json: ${{ steps.resolve.outputs.metadata_json }}
      release_channel: ${{ steps.resolve.outputs.release_channel }}
    steps:
      - name: Checkout main HEAD captured for this run
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup resolver Node runtime
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - id: resolve
        name: Allocate nightly or stable version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}
          VERSION_BUMP: ${{ inputs.bump || 'patch' }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          ORIGINAL_RUN_ID: ${{ github.run_id }}
          ORIGINAL_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          created_at="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN_ID" --jq .created_at)"
          date="$(date --utc --date "$created_at" +%Y%m%d)"
          releases="$RUNNER_TEMP/workbench-releases.json"
          gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          node scripts/resolve-workbench-daily-release.ts \
            --releases-file "$releases" --date "$date" \
            --run-number "$ORIGINAL_RUN_NUMBER" --run-id "$ORIGINAL_RUN_ID" \
            --sha "$RELEASE_SHA" --channel "$RELEASE_CHANNEL" --bump "$VERSION_BUMP" \
            --upstream-tag "$UPSTREAM_TAG" --github-output "$GITHUB_OUTPUT"

  release:
    name: Build and publish Workbench
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/workbench-release.yml
    with:
      commit_sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.version }}
      previous_tag: ${{ needs.resolve.outputs.previous_tag }}
      metadata_json: ${{ needs.resolve.outputs.metadata_json }}
      release_channel: ${{ needs.resolve.outputs.release_channel }}
      release_mode: release
      sign_macos: true
    secrets:
      WORKBENCH_MAC_CSC_LINK: ${{ secrets.WORKBENCH_MAC_CSC_LINK }}
      WORKBENCH_MAC_CSC_KEY_PASSWORD: ${{ secrets.WORKBENCH_MAC_CSC_KEY_PASSWORD }}
      WORKBENCH_APPLE_API_KEY: ${{ secrets.WORKBENCH_APPLE_API_KEY }}
      WORKBENCH_APPLE_API_KEY_ID: ${{ secrets.WORKBENCH_APPLE_API_KEY_ID }}
      WORKBENCH_APPLE_API_ISSUER: ${{ secrets.WORKBENCH_APPLE_API_ISSUER }}
