name: Workbench PR preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.WORKBENCH_PREVIEW_VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.WORKBENCH_PREVIEW_VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.WORKBENCH_PREVIEW_VERCEL_PROJECT_ID }}
      PREVIEW_REPO: filipgutica/t3code
      PREVIEW_PR: "71"
      PREVIEW_SHA: 1619c69e5cdb95c1a5bb7ecb34d125c7aec2d334
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a2c333a5c095ebb9b483a26fe814c521362fa295
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 36333486788
          name: workbench-preview-1619c69e5cdb95c1a5bb7ecb34d125c7aec2d334
          path: /tmp/preview-artifact
      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.1"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.10.0"
      - name: Inspect approved-token API status only
        run: |
          node --input-type=module <<'JS'
          const token = process.env.VERCEL_TOKEN;
          const headers = {Authorization: `Bearer ${token}`};
          const team = process.env.VERCEL_ORG_ID;
          const project = process.env.VERCEL_PROJECT_ID;
          console.log('Team ID matches configured account:', team === 'team_eto3hk9F9ngMUeroJ7HXnVwN');
          console.log('Project ID matches dedicated project:', project === 'prj_t9i0KIDmOqeOdMDW3TWaSULFBD1w');
          for (const [label, path] of [['token', '/v5/user/tokens/current'], ['team', `/teams/${team}?teamId=${team}`], ['versioned team', `/v2/teams/${team}?teamId=${team}`], ['project', `/v9/projects/${project}?teamId=${team}`]]) {
            const response = await fetch(`https://api.vercel.com${path}`, {headers, signal: AbortSignal.timeout(10000)});
            const data = await response.json();
            const redact = value => String(value ?? '').replaceAll(token, '[REDACTED]').slice(0, 500);
            console.log(`${label} API status: ${response.status}; code: ${redact(data.error?.code)}; reason: ${redact(data.error?.message)}`);
            if (label === 'token') console.log('Token team match:', (data.token?.scopes ?? []).some(scope => scope.type === 'team' && scope.teamId === team));
            if (label === 'project') console.log('Project matches ID/team:', data.id === project, data.accountId === team);
          }
          JS
      - name: Diagnose reviewed publisher with redacted child output
        run: |
          cat > /tmp/workbench-publisher-diagnostic.mjs <<'JS'
          import * as childProcess from 'node:child_process';
          import {syncBuiltinESMExports} from 'node:module';
          import {mkdirSync,writeFileSync,rmSync} from 'node:fs';
          const execute = childProcess.execFileSync;
          const redact = text => {
            let result = text;
            for (const secret of [process.env.VERCEL_TOKEN, process.env.GH_TOKEN, process.env.VERCEL_ORG_ID, process.env.VERCEL_PROJECT_ID]) {
              if (secret) result = result.replaceAll(secret, '[REDACTED]');
            }
            return result.slice(0, 5000);
          };
          childProcess.default.execFileSync = (...args) => {
            if (args[0] === 'pnpm') {
              const configuration = '/tmp/workbench-vercel-isolated-auth';
              mkdirSync(configuration, {mode: 0o700});
              writeFileSync(`${configuration}/auth.json`, JSON.stringify({token: process.env.VERCEL_TOKEN}), {mode: 0o600});
              writeFileSync(`${configuration}/config.json`, JSON.stringify({currentTeam: process.env.VERCEL_ORG_ID}), {mode: 0o600});
              const tokenIndex = args[1].indexOf('--token');
              args[1].splice(tokenIndex, 2, '--global-config', configuration);
              const environment = {...process.env};
              delete environment.VERCEL_TOKEN;
              args[2] = {...args[2], env: environment};
            }
            try { return execute(...args); }
            catch (error) {
              if (args[0] === 'pnpm') {
                console.error('Vercel child exit status:', error.status);
                // Never stringify the error: its command field contains --token.
                console.error(redact([error.stdout, error.stderr].map(output => output?.toString() ?? '').join('\n')));
              }
              throw error;
            } finally {
              if (args[0] === 'pnpm') rmSync('/tmp/workbench-vercel-isolated-auth', {recursive: true, force: true});
            }
          };
          syncBuiltinESMExports();
          JS
          node --import=/tmp/workbench-publisher-diagnostic.mjs scripts/workbench-preview/publish.mjs /tmp/preview-artifact/workbench-preview.tar.gz
