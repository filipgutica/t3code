name: Workbench PR preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.WORKBENCH_PREVIEW_VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.WORKBENCH_PREVIEW_VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.WORKBENCH_PREVIEW_VERCEL_PROJECT_ID }}
      PREVIEW_REPO: filipgutica/t3code
      PREVIEW_PR: "71"
      PREVIEW_SHA: 1619c69e5cdb95c1a5bb7ecb34d125c7aec2d334
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a2c333a5c095ebb9b483a26fe814c521362fa295
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 36333486788
          name: workbench-preview-1619c69e5cdb95c1a5bb7ecb34d125c7aec2d334
          path: /tmp/preview-artifact
      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.1"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.10.0"
      - name: Inspect approved-token API status only
        run: |
          node --input-type=module <<'JS'
          const headers = {Authorization: `Bearer ${process.env.VERCEL_TOKEN}`};
          for (const [label, path] of [['user', '/v2/user'], ['team', `/teams/${process.env.VERCEL_ORG_ID}`]]) {
            const response = await fetch(`https://api.vercel.com${path}`, {headers, signal: AbortSignal.timeout(10000)});
            console.log(`${label} API status: ${response.status}`);
          }
          JS
      - name: Diagnose reviewed publisher with redacted child output
        run: |
          cat > /tmp/workbench-publisher-diagnostic.mjs <<'JS'
          import * as childProcess from 'node:child_process';
          import {syncBuiltinESMExports} from 'node:module';
          const execute = childProcess.execFileSync;
          const redact = text => {
            let result = text;
            for (const secret of [process.env.VERCEL_TOKEN, process.env.GH_TOKEN, process.env.VERCEL_ORG_ID, process.env.VERCEL_PROJECT_ID]) {
              if (secret) result = result.replaceAll(secret, '[REDACTED]');
            }
            return result.slice(0, 5000);
          };
          childProcess.default.execFileSync = (...args) => {
            try { return execute(...args); }
            catch (error) {
              if (args[0] === 'pnpm') {
                console.error('Vercel child exit status:', error.status);
                // Never stringify the error: its command field contains --token.
                console.error(redact([error.stdout, error.stderr].map(output => output?.toString() ?? '').join('\n')));
              }
              throw error;
            }
          };
          syncBuiltinESMExports();
          JS
          node --import=/tmp/workbench-publisher-diagnostic.mjs scripts/workbench-preview/publish.mjs /tmp/preview-artifact/workbench-preview.tar.gz
