name: Workbench quality

on:
  pull_request:
    paths:
      - packages/workbench/**
      - apps/server/src/workbench/**
      - apps/web/src/workbench/**
      - apps/web/src/routes/workbench.tsx
      - packages/contracts/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - vite.config.ts
      - knip.jsonc
      - scripts/knip-schemas.ts
      - scripts/workbench-quality.mts
      - scripts/workbench-restyle-ceiling*
      - scripts/lib/workbench-quality*
      - .github/workflows/workbench-quality.yml
  push:
    branches:
      - main
    paths:
      - packages/workbench/**
      - apps/server/src/workbench/**
      - apps/web/src/workbench/**
      - apps/web/src/routes/workbench.tsx
      - packages/contracts/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - vite.config.ts
      - knip.jsonc
      - scripts/knip-schemas.ts
      - scripts/workbench-quality.mts
      - scripts/workbench-restyle-ceiling*
      - scripts/lib/workbench-quality*
      - .github/workflows/workbench-quality.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Types, unit tests, lint and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fallow checks out the base in a temporary worktree. Avoid a partial
          # clone: that checkout would lazily fetch the vendored blobs one by one.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Typecheck Workbench
        run: vp run --filter @t3tools/workbench typecheck

      - name: Test Workbench
        run: vp run --filter @t3tools/workbench test

      - name: Run Workbench quality checks
        run: vp run --filter @t3tools/workbench quality

      - name: Test Workbench quality gate
        run: vp test run scripts/lib/workbench-quality.test.ts

      - name: Gate new Workbench quality findings
        env:
          FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: vp run --filter @t3tools/workbench fallow:audit

  reports:
    name: Complexity and duplication reports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Generate Fallow health report
        if: always()
        run: vp run --filter @t3tools/workbench fallow:health --output-file "$RUNNER_TEMP/workbench-health.json"

      - name: Generate Fallow duplicate report
        if: always()
        run: vp run --filter @t3tools/workbench fallow:dupes --output-file "$RUNNER_TEMP/workbench-dupes.json"

      - name: Upload Workbench advisory reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-quality-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workbench-health.json
            ${{ runner.temp }}/workbench-dupes.json
          if-no-files-found: warn
