name: Workbench quality

on:
  pull_request:
  push:
    branches:
      - main
    # Daily releases require quality proof for every captured main checkpoint.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact published main SHA; fail if the branch moved before dispatch
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: workbench-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop_smoke:
    name: Upstream sync desktop smoke
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (startsWith(github.head_ref || github.ref_name, 'fix/upstream-sync-') || startsWith(github.head_ref || github.ref_name, 'chore/upstream-sync-') || startsWith(github.head_ref || github.ref_name, 'sync/upstream-') || (github.head_ref || github.ref_name) == 'automation/workbench-upstream-sync') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup APT mirrors
        uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build desktop
        run: |
          vp run --filter @t3tools/desktop ensure:electron
          vp run build:desktop

      - name: Smoke test desktop
        run: xvfb-run -a vp run --filter @t3tools/desktop smoke-test

  quality:
    name: Types, unit tests, lint and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fallow checks out the base in a temporary worktree. Avoid a partial
          # clone: that checkout would lazily fetch the vendored blobs one by one.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Verify dispatched checkpoint
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -n "$EXPECTED_SHA" && "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Main moved before dispatch: expected $EXPECTED_SHA, got $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Report native fork patch growth
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/workbench-isolation.ts --report --base "$PR_BASE" --head "$PR_HEAD" --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck Workbench
        run: vp run --filter @t3tools/workbench typecheck

      - name: Test Workbench
        run: vp run --filter @t3tools/workbench test

      - name: Run Workbench quality checks
        run: vp run --filter @t3tools/workbench quality

      - name: Test Workbench quality gate
        run: vp test run scripts/lib/workbench-quality.test.ts scripts/lib/workbench-native-diff.test.ts

      - name: Gate Workbench complexity and new duplication
        env:
          FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: vp run --filter @t3tools/workbench fallow:audit

  reports:
    name: Complexity and duplication reports
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Generate Fallow health report
        if: always()
        run: vp run --filter @t3tools/workbench fallow:health --output-file "$RUNNER_TEMP/workbench-health.json"

      - name: Generate Fallow duplicate report
        if: always()
        run: vp run --filter @t3tools/workbench fallow:dupes --output-file "$RUNNER_TEMP/workbench-dupes.json"

      - name: Upload Workbench advisory reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-quality-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workbench-health.json
            ${{ runner.temp }}/workbench-dupes.json
          if-no-files-found: warn
