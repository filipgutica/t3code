name: Workbench desktop release

on:
  workflow_call:
    inputs:
      commit_sha:
        required: false
        default: ""
        type: string
      version:
        required: true
        type: string
      previous_tag:
        required: false
        default: ""
        type: string
      sign_macos:
        required: false
        default: false
        type: boolean
      release_mode:
        required: false
        default: unsigned-preview
        type: string
      release_channel:
        description: "Workbench updater channel: latest or nightly"
        required: false
        default: latest
        type: string
      metadata_json:
        description: "Release provenance"
        required: false
        default: ""
        type: string
    secrets:
      WORKBENCH_MAC_CSC_LINK:
        required: false
      WORKBENCH_MAC_CSC_KEY_PASSWORD:
        required: false
      WORKBENCH_APPLE_API_KEY:
        required: false
      WORKBENCH_APPLE_API_KEY_ID:
        required: false
      WORKBENCH_APPLE_API_ISSUER:
        required: false
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Source commit to release (blank uses main HEAD captured for this run)"
        required: false
        type: string
      version:
        description: "Workbench version to release (X.Y.Z)"
        required: true
        default: "0.0.2"
        type: string
      previous_tag:
        description: "Optional previous Workbench tag for notes (for example workbench-v0.0.1)"
        required: false
        type: string
      sign_macos:
        description: "Sign and notarize macOS builds (requires Workbench Apple secrets)"
        required: true
        default: true
        type: boolean
      release_mode:
        description: "Publish a release, create an unsigned preview draft, or validate builds"
        required: true
        default: release
        type: choice
        options:
          - release
          - unsigned-preview
          - build-only

# Manual releases and the daily caller share one build. A second run for the
# same version waits for the first one instead of canceling it mid-upload.
concurrency:
  group: workbench-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

# This value is part of the Workbench desktop build contract.
env:
  T3CODE_WORKBENCH_BUILD: "1"

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      release_channel: ${{ steps.resolve.outputs.release_channel }}
      metadata_json: ${{ steps.resolve.outputs.metadata_json }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Setup release Node runtime
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - id: resolve
        name: Resolve release metadata
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'latest' }}
          RELEASE_VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          METADATA_JSON: ${{ inputs.metadata_json }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          SIGN_MACOS: ${{ inputs.sign_macos }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != filipgutica/t3code ]]; then exit 1; fi
          case "$RELEASE_CHANNEL" in latest|nightly) ;; *) echo "Unknown release channel" >&2; exit 1 ;; esac
          if [[ "$RELEASE_MODE" == release && "$SIGN_MACOS" != true ]]; then
            echo "Normal releases require signed and notarized macOS builds." >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if [[ "$RELEASE_CHANNEL" == nightly ]]; then tag="workbench-daily-v$RELEASE_VERSION"; else tag="workbench-v$RELEASE_VERSION"; fi
          metadata="$METADATA_JSON"
          if [[ -z "$metadata" ]]; then
            metadata="$(jq -cn --arg channel "$RELEASE_CHANNEL" --arg version "$RELEASE_VERSION" --arg tag "$tag" --arg sha "$sha" --arg run "$GITHUB_RUN_ID" \
              '{schemaVersion: 2, channel: $channel, version: $version, tag: $tag, sourceSha: $sha, runId: $run}')"
          fi
          printf 'sha=%s\nshould_release=true\nrelease_channel=%s\nversion=%s\ntag=%s\nprevious_tag=%s\nmetadata_json=%s\n' \
            "$sha" "$RELEASE_CHANNEL" "$RELEASE_VERSION" "$tag" "$PREVIOUS_TAG" "$metadata" >> "$GITHUB_OUTPUT"

      - name: Wait for feature CI and quality on the released commit
        if: inputs.release_mode != 'build-only'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            pending=false
            for workflow in workbench-ci.yml workbench-quality.yml; do
              runs="$RUNNER_TEMP/$workflow-runs.json"
              gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$RELEASE_SHA&branch=main&per_page=100" > "$runs"
              status="$(RUNS_FILE="$runs" WORKFLOW_PATH=".github/workflows/$workflow" node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const runs = JSON.parse(readFileSync(process.env.RUNS_FILE, "utf8")).flatMap(p => p.workflow_runs).filter(r =>
                  r.path === process.env.WORKFLOW_PATH && r.head_sha === process.env.RELEASE_SHA &&
                  ["push", "workflow_dispatch"].includes(r.event));
                runs.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt);
                const latest = runs[0];
                process.stdout.write(latest?.status !== "completed" ? "pending" : latest.conclusion === "success" ? "success" : "failed");
              ')"
              if [[ "$status" == failed ]]; then echo "$workflow has not passed for $RELEASE_SHA" >&2; exit 1; fi
              if [[ "$status" != success ]]; then pending=true; fi
            done
            if [[ "$pending" == false ]]; then exit 0; fi
            if [[ "$attempt" != 90 ]]; then sleep 20; fi
          done
          echo "Feature CI and Workbench quality have not both passed for $RELEASE_SHA" >&2
          exit 1

  build_wsl_runtime:
    name: Build WSL CLI runtime (linux-x64)
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1

      - name: Install Linux CLI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsecret-1-dev pkg-config

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Build server and web client
        run: vp run --filter t3 build

      # Match release-desktop.yml: package the complete Linux CLI for WSL.
      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build and stage resource monitor
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

      - name: Build CLI archive
        shell: bash
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.resolve.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.resolve.outputs.version }}"

      - name: Upload Linux CLI archive for WSL
        uses: actions/upload-artifact@v7
        with:
          name: workbench-cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.label }}
    needs: [resolve, build_wsl_runtime]
    if: >-
      always() && !cancelled() &&
      needs.resolve.result == 'success' &&
      needs.build_wsl_runtime.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.platform == 'mac' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    env:
      RELEASE_MODE: ${{ inputs.release_mode }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.release_channel }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        shell: bash
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick

      - name: Install Spectre-mitigated MSVC libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) { exit 1 }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Download Linux CLI archive for WSL
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: workbench-cli-linux-x64
          path: wsl-runtime

      - name: Configure macOS signing
        if: matrix.platform == 'mac' && inputs.sign_macos
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WORKBENCH_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WORKBENCH_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.WORKBENCH_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.WORKBENCH_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.WORKBENCH_APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/workbench-notarization.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; do
            # GitHub multiline values preserve certificate data and passwords.
            delimiter="WORKBENCH_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
          done
          printf 'APPLE_API_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Build desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "$RELEASE_VERSION"
            --verbose
          )
          if [[ "${{ matrix.platform }}" == win ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-${{ matrix.arch }}.tar.gz)
          fi
          if [[ "${{ matrix.platform }}" == mac && "${{ inputs.sign_macos }}" == true ]]; then
            args+=(--signed)
          fi
          # Stapling and dependency downloads intermittently lose their network connection;
          # one rebuild clears those without masking a deterministic failure.
          if ! vp run dist:desktop:artifact "${args[@]}"; then
            echo "::warning::Desktop artifact build failed; retrying once."
            vp run dist:desktop:artifact "${args[@]}"
          fi

      - name: Verify macOS signature and optional notarization
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/workbench-signature-check"
          mkdir -p "$verify_dir"
          ditto -x -k "release/T3-Code-Workbench-$RELEASE_VERSION-${{ matrix.arch }}.zip" "$verify_dir"
          app="$verify_dir/T3 Code Workbench.app"
          codesign --verify --deep --strict "$app"
          if [[ "${{ inputs.sign_macos }}" == true ]]; then
            spctl --assess --type execute --verbose "$app"
            # The ticket lookup reaches Apple CloudKit, which intermittently drops connections.
            for delay in 30 60 120 240 0; do
              xcrun stapler validate "$app" && break
              if [[ "$delay" == 0 ]]; then exit 1; fi
              echo "::warning::stapler validate failed; retrying in ${delay}s."
              sleep "$delay"
            done
          fi

      - name: Remove notarization key
        if: always() && matrix.platform == 'mac' && inputs.sign_macos
        shell: bash
        run: rm -f "$RUNNER_TEMP/workbench-notarization.p8"

      - name: Validate and checksum package
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.AppImage" "release/*.exe" "release/*.blockmap" "release/$RELEASE_CHANNEL*.yml"; do
            for file in $pattern; do cp "$file" release-publish/; done
          done

          case "$BUILD_PLATFORM" in
            mac)
              packages=(release-publish/*.dmg)
              (( ${#packages[@]} == 1 )) || { echo "Expected one macOS DMG." >&2; exit 1; }
              ;;
            linux)
              packages=(release-publish/*.AppImage)
              (( ${#packages[@]} == 1 )) || { echo "Expected one Linux AppImage." >&2; exit 1; }
              ;;
            win)
              packages=(release-publish/*.exe)
              (( ${#packages[@]} == 1 )) || { echo "Expected one Windows installer." >&2; exit 1; }
              ;;
          esac

          # Signed clients must never select an unsigned Mac update.
          if [[ "$BUILD_PLATFORM" == mac && "${{ inputs.sign_macos }}" != true ]]; then
            rm "release-publish/$RELEASE_CHANNEL-mac.yml"
          elif [[ "$BUILD_PLATFORM" == mac && "$BUILD_ARCH" == x64 ]]; then
            mv "release-publish/$RELEASE_CHANNEL-mac.yml" "release-publish/$RELEASE_CHANNEL-mac-x64.yml"
          fi
          case "$BUILD_PLATFORM" in
            mac)
              suffix=""
              if [[ "$BUILD_ARCH" == x64 ]]; then suffix="-x64"; fi
              if [[ "${{ inputs.sign_macos }}" == true ]]; then
                test -f "release-publish/$RELEASE_CHANNEL-mac$suffix.yml"
              fi
              ;;
            linux) test -f "release-publish/$RELEASE_CHANNEL-linux.yml" ;;
            win) test -f "release-publish/$RELEASE_CHANNEL.yml" ;;
          esac

          status="UNSIGNED"
          if [[ "$RELEASE_MODE" == build-only ]]; then status="UNSIGNED BUILD VALIDATION"; fi
          if [[ "$BUILD_PLATFORM" == mac && "${{ inputs.sign_macos }}" == true ]]; then status="SIGNED AND NOTARIZED"; fi
          metadata="release-publish/WORKBENCH-BUILD-INFO-${BUILD_PLATFORM}-${BUILD_ARCH}.txt"
          {
            printf 'T3 Code Workbench desktop build\n'
            printf 'Version: %s\n' "$RELEASE_VERSION"
            printf 'Commit: %s\n' "${{ needs.resolve.outputs.sha }}"
            printf 'Platform: %s\n' "$BUILD_PLATFORM"
            printf 'Architecture: %s\n' "$BUILD_ARCH"
            printf 'Signing status: %s\n' "$status"
          } > "$metadata"

          BUILD_PLATFORM="$BUILD_PLATFORM" BUILD_ARCH="$BUILD_ARCH" node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";
            const dir = "release-publish";
            const names = readdirSync(dir).filter((name) => !name.startsWith("SHA256SUMS-")).sort();
            const lines = names.map((name) => `${createHash("sha256").update(readFileSync(join(dir, name))).digest("hex")}  ${name}`);
            writeFileSync(join(dir, `SHA256SUMS-${process.env.BUILD_PLATFORM}-${process.env.BUILD_ARCH}.txt`), `${lines.join("\n")}\n`);
          '

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: workbench-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 7

  release_draft:
    name: Create Workbench GitHub Release
    needs: [resolve, build]
    if: >-
      always() && !cancelled() && inputs.release_mode != 'build-only' &&
      needs.resolve.result == 'success' && needs.resolve.outputs.should_release == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.release_channel }}
      DAILY_METADATA_JSON: ${{ needs.resolve.outputs.metadata_json }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: ${{ needs.resolve.outputs.release_channel == 'nightly' && '0' || '1' }}

      - name: Write daily release provenance
        run: |
          mkdir -p release-assets
          printf '%s\n' "$DAILY_METADATA_JSON" > release-assets/workbench-release.json

      - name: Setup manifest merge tools
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: workbench-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Verify package checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checksum_files=(release-assets/SHA256SUMS-*.txt)
          (( ${#checksum_files[@]} > 0 )) || { echo "No per-platform checksum files found." >&2; exit 1; }
          for checksum_file in "${checksum_files[@]}"; do
            ( cd release-assets && sha256sum --check "$(basename "$checksum_file")" )
          done
          rm -f release-assets/SHA256SUMS-*.txt
          test -n "$(find release-assets -type f -print -quit)"

          if [[ "${{ inputs.sign_macos }}" == true ]]; then
            node scripts/merge-update-manifests.ts --platform mac "release-assets/$RELEASE_CHANNEL-mac.yml" "release-assets/$RELEASE_CHANNEL-mac-x64.yml"
            rm "release-assets/$RELEASE_CHANNEL-mac-x64.yml"
          else
            test ! -f "release-assets/$RELEASE_CHANNEL-mac.yml"
            test ! -f "release-assets/$RELEASE_CHANNEL-mac-x64.yml"
          fi
          test -f "release-assets/$RELEASE_CHANNEL.yml"
          test -f "release-assets/$RELEASE_CHANNEL-linux.yml"

          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";
            const dir = "release-assets";
            const names = readdirSync(dir).filter((name) => !name.startsWith("SHA256SUMS-")).sort();
            const lines = names.map((name) => `${createHash("sha256").update(readFileSync(join(dir, name))).digest("hex")}  ${name}`);
            writeFileSync(join(dir, "SHA256SUMS.txt"), `${lines.join("\n")}\n`);
          '

      - name: Generate release notes from pull requests
        shell: bash
        env:
          SIGN_MACOS: ${{ inputs.sign_macos }}
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/workbench-releases.json"
          gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          if [[ "$(jq -r '[.[][] | select(.tag_name == env.RELEASE_TAG)][0].draft' "$releases")" == true ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          args=(
            --method POST
            "/repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$RELEASE_TAG"
            -f "target_commitish=$RELEASE_SHA"
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=( -f "previous_tag_name=$PREVIOUS_TAG" )
          fi
          generated_notes="$(gh api "${args[@]}" --jq .body)"
          printf '%s\n' "$generated_notes" | node scripts/workbench-release-notes.ts > "$RUNNER_TEMP/workbench-release-notes.md"

      - name: Publish the complete Workbench release
        shell: bash
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/workbench-releases.json"
          gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          existing="$RUNNER_TEMP/workbench-existing-release.json"
          jq '[.[][] | select(.tag_name == env.RELEASE_TAG)][0]' "$releases" > "$existing"
          if [[ "$(jq -r '.draft' "$existing")" == false ]]; then
            echo "$RELEASE_TAG is already published."
            exit 0
          fi
          prerelease=false; latest=true
          if [[ "$RELEASE_CHANNEL" == nightly || "${{ inputs.release_mode }}" == unsigned-preview ]]; then prerelease=true; latest=false; fi
          jq -n --rawfile body "$RUNNER_TEMP/workbench-release-notes.md" --argjson prerelease "$prerelease" \
            '{tag_name: env.RELEASE_TAG, target_commitish: env.RELEASE_SHA, name: env.RELEASE_TAG, body: $body, draft: true, prerelease: $prerelease, make_latest: "false"}' \
            > "$RUNNER_TEMP/workbench-create-release.json"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/releases" --input "$RUNNER_TEMP/workbench-create-release.json" > "$existing"
          release_id="$(jq -er '.id' "$existing")"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id" > "$existing"
          RELEASE_JSON="$existing" node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readdirSync, readFileSync, statSync } from "node:fs";
            import { join } from "node:path";
            const release = JSON.parse(readFileSync(process.env.RELEASE_JSON, "utf8"));
            const names = readdirSync("release-assets").sort();
            if (release.assets.length !== names.length) throw new Error("Unexpected release assets");
            for (const name of names) {
              const local = join("release-assets", name);
              const asset = release.assets.find(item => item.name === name);
              const digest = `sha256:${createHash("sha256").update(readFileSync(local)).digest("hex")}`;
              if (!asset || asset.state !== "uploaded" || asset.size !== statSync(local).size || asset.digest !== digest)
                throw new Error(`Incomplete or mismatched release asset: ${name}`);
            }
          '
          if [[ "${{ inputs.release_mode }}" == unsigned-preview ]]; then exit 0; fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease" --latest="$latest"
