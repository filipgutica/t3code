name: Workbench upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: workbench-upstream-sync
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      needed: ${{ steps.pending.outputs.needed }}
      product_sha: ${{ steps.pending.outputs.product_sha }}
      upstream_sha: ${{ steps.pending.outputs.upstream_sha }}
    env:
      PRODUCT_BRANCH: workbench/main
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch T3 Code upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --prune upstream main

      - id: pending
        name: Check for upstream commits
        run: |
          echo "product_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview merge
        if: steps.pending.outputs.needed == 'true'
        run: node scripts/workbench-upstream-sync.ts --product HEAD --upstream upstream/main

      - name: Merge upstream on a sync branch
        if: steps.pending.outputs.needed == 'true'
        env:
          SYNC_BRANCH: automation/workbench-upstream-${{ github.run_id }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$SYNC_BRANCH"
          git merge --no-edit upstream/main

      - name: Setup Vite+
        if: steps.pending.outputs.needed == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Verify Workbench overlay
        if: steps.pending.outputs.needed == 'true'
        run: |
          vp test run packages/contracts/src/workbench.test.ts apps/server/src/workbench/WorkbenchStore.test.ts apps/server/src/auth/RpcAuthorization.test.ts apps/web/src/workbench/workbench.logic.test.ts
          vp run --filter @t3tools/contracts typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/desktop ensure:electron
          vp run build:desktop
          xvfb-run -a vp run --filter @t3tools/desktop smoke-test

  publish:
    needs: verify
    if: needs.verify.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      PRODUCT_BRANCH: workbench/main
      SYNC_BRANCH: automation/workbench-upstream-sync
      GH_TOKEN: ${{ github.token }}
      PRODUCT_SHA: ${{ needs.verify.outputs.product_sha }}
      UPSTREAM_SHA: ${{ needs.verify.outputs.upstream_sha }}
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0

      - name: Recreate verified merge
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --prune upstream main
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$SYNC_BRANCH"
          git merge --no-edit "$UPSTREAM_SHA"
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Open sync pull request
        run: |
          if [[ -z "$(gh pr list --base "$PRODUCT_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')" ]]; then
            gh pr create \
              --base "$PRODUCT_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "chore: sync T3 Code upstream" \
              --body "Automated merge of pingdotgg/t3code main into the Workbench product branch. Focused Workbench tests, typechecks, desktop build, and desktop smoke passed before this PR was opened."
          fi
