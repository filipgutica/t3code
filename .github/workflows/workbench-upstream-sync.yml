name: Workbench upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: workbench-upstream-sync
  cancel-in-progress: false

env:
  PRODUCT_BRANCH: ${{ github.event.repository.default_branch }}
  SYNC_BRANCH: automation/workbench-upstream-sync

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      needed: ${{ steps.preview.outputs.proceed }}
      integrated: ${{ steps.pending.outputs.integrated }}
      product_sha: ${{ steps.pending.outputs.product_sha }}
      verified_sha: ${{ steps.bundle.outputs.verified_sha }}
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          # Eager auth cleanup fails on vendored gitlinks without .gitmodules entries.
          # Keep the read-only token until post-job cleanup on this disposable runner.
          persist-credentials: true

      - name: Fetch T3 Code upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --prune upstream main

      - id: pending
        name: Check for upstream commits
        run: |
          echo "product_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "integrated=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require fork CI ownership
        if: steps.pending.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq .state)"
          if [[ "$state" != "disabled_manually" ]]; then
            echo "Upstream CI must be disabled in this fork; Workbench owns its focused checks." >&2
            exit 1
          fi

      - name: Setup Node for merge preview
        if: steps.pending.outputs.needed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - id: preview
        name: Preview merge
        if: steps.pending.outputs.needed == 'true'
        shell: bash
        run: |
          status=0
          node scripts/workbench-upstream-sync.ts --product HEAD --upstream upstream/main > "$RUNNER_TEMP/upstream-sync-preview.json" || status=$?
          cat "$RUNNER_TEMP/upstream-sync-preview.json"
          if [[ "$status" == 2 ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Upstream sync needs a manual merge"
              echo "No merge was published. Conflicting paths:"
              jq -r '.conflictPaths[] | "- " + .' "$RUNNER_TEMP/upstream-sync-preview.json"
              echo "Upstream changes to active workflows or actions, which need review:"
              jq -r '.ciReviewPaths[] | "- " + .' "$RUNNER_TEMP/upstream-sync-preview.json"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" == 0 ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Upload merge preview
        if: always() && steps.pending.outputs.needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-preview
          path: ${{ runner.temp }}/upstream-sync-preview.json
          if-no-files-found: warn
          retention-days: 7

      - name: Merge upstream on a sync branch
        if: steps.preview.outputs.proceed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$SYNC_BRANCH"
          if git merge --no-commit --no-ff upstream/main; then
            :
          else
            conflict_paths="$(git diff --name-only --diff-filter=U)"
            if [[ "$conflict_paths" != "pnpm-lock.yaml" ]]; then
              git merge --abort
              echo "Unsupported upstream merge conflicts: ${conflict_paths:-unknown paths}" >&2
              exit 1
            fi
            git checkout --theirs -- pnpm-lock.yaml
            git add pnpm-lock.yaml
          fi

      - name: Review remaining fork ownership and regenerate focused CI
        if: steps.preview.outputs.proceed == 'true'
        run: node scripts/workbench-ci.ts --upstream upstream/main

      - name: Setup Vite+
        if: steps.preview.outputs.proceed == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Regenerate and install the merged lockfile
        if: steps.preview.outputs.proceed == 'true'
        run: |
          vp install --lockfile-only --no-frozen-lockfile
          vp install --frozen-lockfile
          git add pnpm-lock.yaml .github/workflows/workbench-ci.yml scripts/workbench-ci-scope.json
          git commit --no-edit

      - name: Setup APT mirrors
        if: steps.preview.outputs.proceed == 'true'
        uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        if: steps.preview.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install Chromium for web integration tests and Workbench regressions
        if: steps.preview.outputs.proceed == 'true'
        working-directory: scripts
        run: vp exec playwright install --with-deps chromium

      - name: Verify Workbench overlay
        if: steps.preview.outputs.proceed == 'true'
        run: |
          node scripts/workbench-ci.ts --check
          node scripts/workbench-ci.ts --lint
          vp run --filter @t3tools/desktop ensure:electron
          node scripts/workbench-ci.ts --typecheck
          node scripts/workbench-ci.ts --run-tests
          node scripts/workbench-ci.ts --packaging
          vp run --filter @t3tools/workbench quality
          vp exec tsc --noEmit -p scripts/workbench-regression/tsconfig.json
          T3CODE_WORKBENCH_BUILD=1 vp run build:desktop
          node apps/desktop/scripts/verify-preload-bundle.mjs
          xvfb-run -a node scripts/workbench-desktop-smoke.mjs

      - name: Verify simulated Workbench regressions
        if: steps.preview.outputs.proceed == 'true'
        # Runs the server and web client that build:desktop produced above.
        working-directory: scripts
        run: vp exec playwright test --config workbench-regression/playwright.config.ts

      - name: Bundle the verified merge
        id: bundle
        if: steps.preview.outputs.proceed == 'true'
        env:
          PRODUCT_SHA: ${{ steps.pending.outputs.product_sha }}
        run: |
          git diff --exit-code HEAD
          read -r first_parent second_parent extra <<< "$(git show -s --format='%P' HEAD)"
          test "$first_parent" = "$PRODUCT_SHA"
          test -n "$second_parent"
          test -z "${extra:-}"
          echo "verified_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/verified-sync.bundle" "$SYNC_BRANCH" "^$PRODUCT_SHA"

      - name: Upload the verified merge
        if: steps.preview.outputs.proceed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-upstream-sync
          path: ${{ runner.temp }}/verified-sync.bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    timeout-minutes: 10
    needs: verify
    if: needs.verify.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    # The App's private key is an environment secret, available only to runs from main.
    environment: workbench-upstream-sync
    # Writes use the App token below; GITHUB_TOKEN cannot push upstream commits that touch
    # workflow files.
    permissions:
      contents: read
    outputs:
      merge_sha: ${{ steps.publish.outputs.merge_sha }}
    env:
      PRODUCT_SHA: ${{ needs.verify.outputs.product_sha }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
    steps:
      # Minted only in this job, which runs the product branch's scripts and fetches the
      # verified merge as data. The verify job, which executes the upstream tree, never sees it.
      - id: app-token
        name: Create the sync App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WORKBENCH_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKBENCH_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout product branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download the verified merge
        uses: actions/download-artifact@v8
        with:
          name: verified-upstream-sync
          path: ${{ runner.temp }}

      - name: Setup Node for merge validation
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - id: prepare
        name: Prepare the verified sync PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git fetch "$RUNNER_TEMP/verified-sync.bundle" "$SYNC_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$VERIFIED_SHA"
          git merge-base --is-ancestor "$PRODUCT_SHA" "$VERIFIED_SHA"
          product_remote_sha="$(git ls-remote --refs origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$product_remote_sha" = "$PRODUCT_SHA"

          sync_remote_sha="$(git ls-remote --refs origin "refs/heads/$SYNC_BRANCH" | awk '{print $1}')"
          if [[ -n "$sync_remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$SYNC_BRANCH:$sync_remote_sha" origin "$VERIFIED_SHA:refs/heads/$SYNC_BRANCH"
          else
            git push --force-with-lease="refs/heads/$SYNC_BRANCH:" origin "$VERIFIED_SHA:refs/heads/$SYNC_BRANCH"
          fi

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$PRODUCT_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$PRODUCT_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "chore: sync T3 Code upstream" \
              --body "Automated merge of pingdotgg/t3code main into the Workbench product branch. Focused Workbench tests, typechecks, desktop build, and desktop smoke passed before this PR was opened. This workflow merges only the exact verified head with a merge commit, never squash or rebase, to preserve upstream ancestry for future syncs." \
              > /dev/null
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$PRODUCT_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          test -n "$pr_number"

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Wait for the verified sync merge ref
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/sync-pr.json"
            node scripts/workbench-upstream-sync-merge.ts \
              --pr-json "$RUNNER_TEMP/sync-pr.json" \
              --repository "$GITHUB_REPOSITORY" \
              --product-branch "$PRODUCT_BRANCH" \
              --sync-branch "$SYNC_BRANCH" \
              --product-sha "$PRODUCT_SHA" \
              --verified-sha "$VERIFIED_SHA"
            mergeable="$(jq -r '.mergeable' "$RUNNER_TEMP/sync-pr.json")"
            if [[ "$mergeable" == false ]]; then
              echo "Sync PR #$PR_NUMBER has merge conflicts; refusing to publish." >&2
              exit 1
            fi
            if [[ "$mergeable" == true ]] && git fetch --no-tags origin "refs/pull/$PR_NUMBER/merge"; then
              exit 0
            fi
            if [[ "$attempt" != 30 ]]; then sleep 2; fi
          done
          echo "Timed out waiting for sync PR #$PR_NUMBER merge ref after 30 attempts." >&2
          exit 1

      - name: Publish the verified merge
        id: publish
        run: |
          set -euo pipefail
          merge_sha="$(git rev-parse FETCH_HEAD)"
          read -r first_parent second_parent extra <<< "$(git show -s --format='%P' "$merge_sha")"
          test -z "${extra:-}"
          test "$first_parent" = "$PRODUCT_SHA"
          test "$second_parent" = "$VERIFIED_SHA"
          test "$(git rev-parse "$merge_sha^{tree}")" = "$(git rev-parse "$VERIFIED_SHA^{tree}")"

          # This is intentionally a normal update. If main changed after the
          # base check, the ref update is rejected instead of merging an
          # unverified base. Branch protection is also allowed to reject it.
          git push origin "$merge_sha:refs/heads/$PRODUCT_BRANCH"

          git fetch --no-tags origin "$PRODUCT_BRANCH"
          git cat-file -e "$merge_sha^{commit}"
          git merge-base --is-ancestor "$merge_sha" "origin/$PRODUCT_BRANCH"
          read -r first_parent second_parent extra <<< "$(git show -s --format='%P' "$merge_sha")"
          test -z "${extra:-}"
          test "$first_parent" = "$PRODUCT_SHA"
          test "$second_parent" = "$VERIFIED_SHA"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: [verify, publish]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.publish.result == 'success' || needs.verify.outputs.integrated == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISHED_SHA: ${{ needs.publish.outputs.merge_sha || needs.verify.outputs.product_sha }}
    steps:
      - name: Checkout published checkpoint
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PUBLISHED_SHA }}
          fetch-depth: 0

      - name: Identify already-published sync merge
        if: needs.publish.result != 'success'
        run: |
          set -euo pipefail
          read -r first_parent second_parent extra <<< "$(git show -s --format='%P' HEAD)"
          if [[ -z "$second_parent" || -n "${extra:-}" ]]; then exit 0; fi
          matching_prs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$PUBLISHED_SHA/pulls" \
            --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"$PUBLISHED_SHA\"
              and .base.ref == \"$PRODUCT_BRANCH\" and .base.repo.full_name == \"$GITHUB_REPOSITORY\"
              and .head.ref == \"$SYNC_BRANCH\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\"
              and .head.sha == \"$second_parent\") | .number")"
          if [[ -z "$matching_prs" ]]; then exit 0; fi
          test "$(git rev-parse "HEAD^{tree}")" = "$(git rev-parse "$second_parent^{tree}")"
          echo "REPAIR_SYNC_GATES=true" >> "$GITHUB_ENV"

      - name: Dispatch gates for the published main merge
        if: needs.publish.result == 'success' || env.REPAIR_SYNC_GATES == 'true'
        run: |
          set -euo pipefail
          retained_run() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$PUBLISHED_SHA&branch=$PRODUCT_BRANCH&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$PUBLISHED_SHA\"
                and (.event == \"push\" or .event == \"workflow_dispatch\")
                and .path == \".github/workflows/$workflow\" and .head_branch == \"$PRODUCT_BRANCH\")" \
              | jq -sr --arg since "$1" '
                map(select($since == "" or (.event == "workflow_dispatch" and .created_at >= $since)))
                | sort_by(.run_number, .run_attempt) | last
                | select(. != null and ($since != "" or .status != "completed" or .conclusion == "success"))
                | .id'
          }
          for workflow in workbench-ci.yml workbench-quality.yml; do
            existing="$(retained_run "")"
            if [[ -n "$existing" ]]; then continue; fi
            dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            product_remote_sha="$(git ls-remote --refs origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
            test "$product_remote_sha" = "$PUBLISHED_SHA"
            if gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" \
              --ref "$PRODUCT_BRANCH" -f "expected_sha=$PUBLISHED_SHA"; then
              continue
            fi
            # A failed client response can still have created a run, even one that already failed.
            # Run listings are eventually consistent; never re-dispatch while acceptance is unknown.
            for attempt in {1..12}; do
              sleep 5
              existing="$(retained_run "$dispatch_started")"
              if [[ -n "$existing" ]]; then break; fi
            done
            if [[ -z "$existing" ]]; then
              echo "Dispatch acceptance unknown for $workflow at $PUBLISHED_SHA after 60 seconds. Rerun this job to repair missing gates; no second dispatch was sent." >&2
              exit 1
            fi
          done
