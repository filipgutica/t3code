name: Workbench regression

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - "packages/**"
      - "scripts/workbench-demo/**"
      - "scripts/workbench-regression/**"
      - "scripts/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/workbench-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: UI flows and Jira lifecycle (simulated services) ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          run-install: true
      - name: Install Chromium
        working-directory: scripts
        run: vp exec playwright install --with-deps chromium
      - name: Check regression tooling
        if: ${{ matrix.shard == 1 }}
        run: |
          vp exec tsc --noEmit -p scripts/workbench-regression/tsconfig.json
          vp lint scripts/workbench-regression --report-unused-disable-directives
      - name: Run browser regressions
        # Unbundled dev: upstream's bundled dev (T3CODE_BUNDLED_DEV) crashes on first load with
        # `factory.fn is not a function` as of 52bb5c8.
        working-directory: scripts
        run: vp exec playwright test --config workbench-regression/playwright.config.ts --shard=${{ matrix.shard }}/3
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-regression-${{ matrix.shard }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload settlement UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-settlement-ui-${{ matrix.shard }}
          path: .test-results/**/settlement-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
